[package]
name = "web3_proxy"
version = "2.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

[dependencies]
deduped_broadcast = { path = "../deduped_broadcast" }
latency = { path = "../latency" }

# TODO: regex has several "perf" features that we might want to use
anyhow = { version = "1.0.104", features = ["backtrace"] }
alloy = { version = "2.4.1", default-features = false, features = [
    "consensus",
    "eips",
    "node-bindings",
    "provider-http",
    "provider-ws-ring",
    "reqwest",
    "reqwest-rustls-tls",
    "rpc-types-eth",
    "serde",
    "signer-local",
    "std",
] }
arc-swap = { version = "1.9.2" }
argh = { version = "0.1.19", default-features = false, features = ["help"] }
async-stream = "0.3.6"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "tracing", "ws"] }
axum-macros = "0.5.1"
base64 = "0.23.1"
bytes = "1.12.1"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
derivative = "2.2.0"
derive_more = { version = "2.1.1", features = ["display", "error", "from"] }
fdlimit = "0.3.0"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hashbrown = { version = "0.17.1", features = ["serde"] }
hdrhistogram = { version = "7.6.0", default-features = false, features = ["serialization"] }
hostname = "0.4.2"
http = "1.5.0"
itertools = "0.15.0"
listenfd = { version = "1.0.2", optional = true }
moka = { version = "0.12.16", default-features = false, features = ["atomic64", "future", "quanta"] }
nanorand = { version = "0.8.0", default-features = false, features = ["tls"] }
once_cell = { version = "1.21.4" }
ordered-float = {version = "5.5.0" }
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
sentry = { version = "0.49.1", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
sentry-tracing = "0.49.1"
serde = { version = "1.0.229", features = ["rc"] }
serde-inline-default = "1.0.2"
# Alloy requires this raw type for type-erased WebSocket requests.
serde_json = { version = "1.0.151", default-features = false, features = ["raw_value"] }
shellexpand = { version = "3.1.2", default-features = false, features = ["base-0"] }
sonic-rs = "0.5.8"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "tracing"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["cors", "normalize-path", "sensitive-headers", "trace"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
ulid = "3.0.0"
url = { version = "2.5.8" }

# # TODO: bring this back
# check-if-email-exists = "0.9.0"

[dev-dependencies]
test-log = { version = "0.2.21", default-features = false, features = ["trace"] }
tokio = { version = "1.53.1", default-features = false, features = ["test-util"] }
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
