[package]
name = "web3_proxy_cli"
version = "2.0.0"
edition = "2021"
default-run = "web3_proxy_cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

mimalloc = ["dep:mimalloc"]
tokio-console = ["dep:console-subscriber"]

[dependencies]
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }
web3_proxy = { path = "../web3_proxy" }

console-subscriber = { version = "0.5.0", default-features = false, features = ["env-filter"], optional = true }
dotenvy = "0.15.7"
jiff = { version = "0.2.43", default-features = false, features = ["serde", "std"] }
mimalloc = { version = "0.1.52", optional = true }
prettytable = { version = "0.10.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", features = ["raw_value", "arbitrary_precision"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
sonic-rs = "0.5.11"
test-log = { version ="0.2.21", default-features = false, features = ["trace"] }
