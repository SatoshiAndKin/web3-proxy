[package]
name = "web3_proxy_cli"
version = "2.0.0"
edition = "2021"
default-run = "web3_proxy_cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

deadlock_detection = ["dep:parking_lot", "parking_lot/deadlock_detection"]
mimalloc = ["dep:mimalloc"]
tokio-console = ["dep:console-subscriber"]

[dependencies]
web3_proxy = { path = "../web3_proxy" }

console-subscriber = { version = "0.5.0", default-features = false, features = ["env-filter", "parking_lot"], optional = true }
dotenvy = "0.15.7"
jiff = { version = "0.2.35", default-features = false, features = ["serde", "std"] }
mimalloc = { version = "0.1.52", optional = true }
parking_lot = { version = "0.12.5", optional = true }
prettytable = { version = "0.10.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.151"
sonic-rs = "0.5.8"
test-log = { version ="0.2.21", default-features = false, features = ["trace"] }
