[package]
name = "web3_proxy_cli"
version = "1.43.100"
edition = "2021"
default-run = "web3_proxy_cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tokio-console"]

deadlock_detection = ["parking_lot/deadlock_detection"]
mimalloc = ["dep:mimalloc"]
tests-needing-docker = ["web3_proxy/tests-needing-docker"]
tokio-console = ["dep:tokio-console", "dep:console-subscriber"]

[dependencies]
web3_proxy = { path = "../web3_proxy" }

console-subscriber = { version = "0.5.0", features = ["env-filter", "parking_lot"], optional = true }
mimalloc = { version = "0.1.52", optional = true }
parking_lot = { version = "0.12.5", features = ["arc_lock", "nightly"] }
prettytable = { version = "0.10.0", default-features = false }
serde = { version = "1.0.229" }
sonic-rs = "0.5.8"
tokio-console = { version = "0.1.14", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
env_logger = { version ="0.11", default-features = false, features = ["auto-color"] }
serde_json = "1.0.151"
test-log = { version ="0.2.21", default-features = false, features = ["trace"] }
