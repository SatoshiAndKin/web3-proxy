---
# production config
version: "3.4"

services:
  arbitrum:
    extends:
      file: docker-compose.common.yml
      service: web3-proxy
    volumes:
      - ./config/production-arbitrum.toml:/config.toml
    ports:
      - mode: host
        protocol: tcp
        published: 7700
        target: 8544

  # avalanche-c:
