name: Production image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      # The GHA layer exporter does not include RUN cache mounts. Restore Cargo's
      # dependency and compiler caches separately; Cargo still checks fingerprints.
      - name: Restore Cargo build caches
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-cache
          key: cargo-production-amd64-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'docker/production.Dockerfile', 'docker/cargo-cache.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cargo-production-amd64-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', 'docker/production.Dockerfile', 'docker/cargo-cache.Dockerfile') }}-
      - name: Restore Cargo cache mounts
        if: steps.cargo-cache.outputs.cache-hit != ''
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          # Cache contents do not invalidate RUN layers. Always execute the helper.
          docker buildx build --builder "$BUILDER" --platform linux/amd64 \
            --no-cache --progress plain --file docker/cargo-cache.Dockerfile \
            --target restore --output type=cacheonly "$RUNNER_TEMP/cargo-cache"
      - name: Registry login
        if: github.repository == 'SatoshiAndKin/web3-proxy'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate, build, and publish
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/production.Dockerfile
          platforms: linux/amd64
          push: ${{ github.repository == 'SatoshiAndKin/web3-proxy' }}
          tags: ghcr.io/satoshiandkin/web3-proxy:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,scope=production-amd64,mode=max
          # Layer-cache hits contain no cache-mount data. Populate fresh Cargo
          # mounts when no archive exists, even if the source layers are cached.
          no-cache-filters: ${{ steps.cargo-cache.outputs.cache-hit == '' && 'checked,binary' || '' }}
          provenance: true
          sbom: true
      - name: Export Cargo cache mounts
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cargo-cache-empty"
          # Export two archive files directly; do not load an intermediate image
          # into Docker or copy millions of cache files through a container.
          docker buildx build --builder "$BUILDER" --platform linux/amd64 \
            --no-cache --progress plain --file docker/cargo-cache.Dockerfile \
            --target export --output "type=local,dest=$RUNNER_TEMP/cargo-cache-export" \
            "$RUNNER_TEMP/cargo-cache-empty"
          (cd "$RUNNER_TEMP/cargo-cache-export" && sha256sum --check SHA256SUMS)
          rm -rf "$RUNNER_TEMP/cargo-cache"
          mv "$RUNNER_TEMP/cargo-cache-export" "$RUNNER_TEMP/cargo-cache"
      - name: Publish latest for the successful current-main build
        if: github.repository == 'SatoshiAndKin/web3-proxy' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(git ls-remote https://github.com/SatoshiAndKin/web3-proxy.git refs/heads/main | cut -f1)
          if [ "$current" = "$COMMIT" ]; then
            docker buildx imagetools create --tag ghcr.io/satoshiandkin/web3-proxy:latest \
              "ghcr.io/satoshiandkin/web3-proxy@$IMAGE_DIGEST"
          fi
      - name: Record immutable deployment reference
        if: github.repository == 'SatoshiAndKin/web3-proxy'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'Deploy ghcr.io/satoshiandkin/web3-proxy@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Request production deployment
    needs: image
    if: github.repository == 'SatoshiAndKin/web3-proxy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Queue deployment on Tank
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DEPLOY_URL:?DEPLOY_WEBHOOK_URL must be configured}"
          : "${WEBHOOK_SECRET:?WEBHOOK_SECRET must be configured}"
          payload=$(jq -cn --arg repository "$REPOSITORY" --arg commit "$COMMIT" \
            '{repository: $repository, commit: $commit, targets: ["web3-proxy"]}')
          receipt=$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
            --header "X-Webhook-Secret: $WEBHOOK_SECRET" \
            --header 'Content-Type: application/json' --data "$payload" "$DEPLOY_URL")
          printf '%s\n' "$receipt"
          printf 'Tank deployment receipt: %s\n\nThe worker records completion after NUC and Lambo health checks.\n' \
            "$receipt" >> "$GITHUB_STEP_SUMMARY"
