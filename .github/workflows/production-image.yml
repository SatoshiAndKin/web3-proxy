name: Production image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Registry login
        if: github.repository == 'SatoshiAndKin/web3-proxy'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate, build, and publish
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/production.Dockerfile
          platforms: linux/amd64
          push: ${{ github.repository == 'SatoshiAndKin/web3-proxy' }}
          tags: ghcr.io/satoshiandkin/web3-proxy:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=production-amd64
          cache-to: type=gha,scope=production-amd64,mode=max
          provenance: true
          sbom: true
      - name: Record immutable deployment reference
        if: github.repository == 'SatoshiAndKin/web3-proxy'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'Deploy `ghcr.io/satoshiandkin/web3-proxy@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
